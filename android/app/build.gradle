plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Release signing ─────────────────────────────────────────────────────────
// `android/key.properties` is machine-local (gitignored) and points at the
// upload keystore. One-time generation steps live in
// docs/release/android_signing.md. CI recreates the same file from GitHub
// Secrets before building the AAB.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "io.pulseapp.pulse"
    // Play policy pins: new apps / updates must target the latest API level
    // by each year's deadline (35 required since 2025-08-31). Explicit values
    // so a Flutter upgrade cannot silently move the app out of the
    // compliance window. Bump deliberately, together with a device pass.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "io.pulseapp.pulse"
        // WebRTC / BLE / secure-storage plugins require API 23+.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Signed with the upload keystore when android/key.properties is
            // present; falls back to debug keys so `flutter run --release`
            // still works on machines without release credentials.
            signingConfig = keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            // R8: shrink Java/Kotlin bytecode and drop unused resources.
            // Keep rules for WebRTC / BLE / Billing live in proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
