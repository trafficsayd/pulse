plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Read release signing credentials from android/key.properties (gitignored).
// If the file is absent (e.g. CI without secrets), the release build falls
// back to debug signing so `flutter build` still works for local testing.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "io.pulseapp.pulse"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "io.pulseapp.pulse"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packagingOptions {
        // Strip the debug-only Vulkan validation layer (≈13 MB per ABI) from
        // release builds. Play Console rejects APKs containing it, and it
        // is only useful when developing the renderer.
        resources.excludes += "lib/*/libVkLayer_khronos_validation.so"
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey("storeFile")) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            // Keep the QA build beside the signed app so emulator tests never
            // overwrite saved pairs or other release data.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Use the release keystore if key.properties is configured;
            // otherwise fall back to debug keys so local builds still work.
            signingConfig keystoreProperties.containsKey("storeFile") \
                ? signingConfigs.release : signingConfigs.debug

            // Enable R8/ProGuard shrinking and resource optimization for
            // smaller release APKs / AABs.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
