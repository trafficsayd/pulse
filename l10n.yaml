arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
# Generate into lib/l10n/ (imported directly), not the synthetic flutter_gen
# package. Required so `import '../l10n/app_localizations.dart'` resolves on
# Flutter 3.27 (where synthetic-package still defaults to true).
synthetic-package: false
