name: pulse
description: "Pulse — non-verbal sensory communication app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Internationalization
  intl: any

  # Secure storage abstraction (iOS Keychain / Android EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2

  # QR rendering for the pairing screen
  qr_flutter: ^4.1.0

  # In-app purchases (Pulse Premium subscription via App Store / Play Store)
  in_app_purchase: ^3.2.0

  # App version / build metadata used by the IAP receipts and About screen
  package_info_plus: ^8.0.2

  # Opening App Store / Play subscription-management URLs from the paywall.
  url_launcher: ^6.3.1

  # Cryptography (Curve25519 ECDH, HKDF-SHA-256, AES-256-GCM)
  cryptography: ^2.7.0

  # HTTP client used by the signaling client that brokers WebRTC SDP / ICE
  # between two peers via the Cloudflare Worker in `signaling/`.
  http: ^1.2.2

  # Utilities
  collection: ^1.18.0
  uuid: ^4.5.1
  meta: ^1.15.0

  # Mode primitives (Track C).
  # NOTE: lock to exact minor versions, never `any`, so a transitive bump
  # cannot silently change microphone / sensor behaviour between releases.
  sensors_plus: ^4.0.2
  vibration: ^3.1.3
  record: ^5.1.2
  permission_handler: ^11.3.1

  # Track F1 — real Bluetooth Low Energy transport (central + Android
  # peripheral scaffolding). Pinned to a minor floor so a transitive bump
  # cannot silently change GATT behaviour between releases.
  flutter_blue_plus: ^1.32.0

  # Track F3 — real WebRTC data-channel transport (P2P over the internet
  # relay tier). SDP/ICE are brokered by the Cloudflare Worker in
  # `signaling/`; once the data channel opens, sealed packets travel P2P
  # (DTLS-SRTP) and never touch the Worker. Falls back to the Worker relay
  # if the data channel cannot open (e.g. symmetric NAT without TURN).
  flutter_webrtc: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # On-device integration tests (integration_test/). Run on a real device:
  #   flutter test integration_test -d <device-id>
  integration_test:
    sdk: flutter

  # App icon + splash generation (dev-time only — run once, commit the output).
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/sounds/sneak/
    - assets/icons/

# ── App icon (flutter_launcher_icons) ───────────────────────────────────────
# Source art: assets/icon/app_icon.png (1024×1024). Regenerate with
# `dart run flutter_launcher_icons`. Keeps Pulse's palette on the icon canvas.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 29
  background_color_ios: "#06070C"
  adaptive_icon_background: "#06070C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ── Launch splash (flutter_native_splash) ───────────────────────────────────
# Regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#06070C"
  image: assets/icon/splash.png
  android_12:
    color: "#06070C"
    image: assets/icon/splash.png

# Build-time override: on Dart 3.6 the record 5.x family resolves an
# incompatible pair (record_linux 0.7.2 vs record_platform_interface 1.6.0).
# Pin the interface to the pre-recorderId signature record_linux expects.
dependency_overrides:
  # record 5.x caps record_linux at 0.7.2 (no startStream); force a newer
  # desktop impl that implements the streaming interface we use.
  record_linux: ^1.0.0
