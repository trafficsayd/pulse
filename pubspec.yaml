name: pulse
description: "Pulse — non-verbal sensory communication app."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Internationalization
  intl: any

  # Secure storage abstraction (iOS Keychain / Android EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2

  # QR rendering for the pairing screen
  qr_flutter: ^4.1.0

  # Utilities
  collection: ^1.18.0
  uuid: ^4.5.1
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/
    - assets/icons/
