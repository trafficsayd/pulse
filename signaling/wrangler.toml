name = "pulse-signaling"
main = "src/index.ts"
compatibility_date = "2026-05-20"
compatibility_flags = ["nodejs_compat"]

account_id = "75377a196e8fd601606b3fcf2a458356"

# Workers Logs (free tier) — keeps stdout/stderr visible in the dashboard.
[observability]
enabled = true

# KV namespace that stores signaling sessions, offers, answers, ICE candidates
# and per-IP rate-limit counters. Create it with:
#
#   wrangler kv:namespace create SIGNALING_SESSIONS
#   wrangler kv:namespace create SIGNALING_SESSIONS --preview
#
# then paste the returned ids below.
[[kv_namespaces]]
binding = "SIGNALING_SESSIONS"
id = "5ce59310fd32480faa890a8d77b3186d"

[[d1_databases]]
binding = "SIGNALING_DB"
database_name = "pulse-signaling-db"
database_id = "a50f3a29-1bd0-4ba0-9a6e-101771d5f5a8"
migrations_dir = "migrations"

# WORKER_SECRET is the HMAC key used to sign per-session bearer tokens.
# Set it for real deployments with:
#
#   wrangler secret put WORKER_SECRET
#   wrangler secret put TURN_KEY_ID
#   wrangler secret put TURN_KEY_API_TOKEN
#
# For local `wrangler dev` runs put a value into `.dev.vars` (gitignored) or
# export WORKER_SECRET in the shell.
[vars]
# Default values used during `wrangler dev` only. Real environments override
# these via `wrangler secret put`.
ICE_LONG_POLL_TIMEOUT_MS = "25000"
ICE_LONG_POLL_INTERVAL_MS = "500"
# Local dev: two emulators NAT through the host so they share the source IP.
# 30/min trips during two-device handshakes; 240/min gives headroom while
# still exercising the limiter code path. Production keeps 30 via env override.
RATE_LIMIT_PER_MINUTE = "240"
SESSION_TTL_SECONDS = "600"
